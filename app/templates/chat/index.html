{% extends "base.html" %}

{% block title %}智能客服 - RAG 系統{% endblock %}

{% block styles %}
<style>
    .chat-container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        height: 700px;
        display: flex;
        flex-direction: column;
    }
    .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1.5rem;
        border-radius: 12px 12px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .chat-header h2 {
        margin: 0 0 0.5rem 0;
        font-size: 1.5rem;
    }
    .domain-selector {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.5rem;
    }
    .domain-selector label {
        font-size: 0.9rem;
        opacity: 0.9;
    }
    .domain-selector select {
        padding: 0.4rem 0.8rem;
        border: none;
        border-radius: 6px;
        background: rgba(255,255,255,0.2);
        color: white;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .domain-selector select option {
        color: #333;
    }
    .chat-messages {
        flex: 1;
        padding: 2rem;
        overflow-y: auto;
        background: #f8f9fa;
    }
    .message {
        margin-bottom: 1.5rem;
        padding: 1rem 1.2rem;
        border-radius: 12px;
        max-width: 75%;
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .message.user {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        margin-left: auto;
        text-align: left;
        box-shadow: 0 2px 8px rgba(102,126,234,0.3);
    }
    .message.bot {
        background: white;
        border: 1px solid #e0e0e0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .message.bot strong {
        color: #667eea;
        font-weight: 600;
    }
    .chat-input {
        padding: 1.5rem;
        border-top: 2px solid #e0e0e0;
        background: white;
        display: flex;
        gap: 1rem;
        border-radius: 0 0 12px 12px;
    }
    .chat-input input {
        flex: 1;
        padding: 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
    }
    .chat-input input:focus {
        outline: none;
        border-color: #667eea;
    }
    .chat-input button {
        padding: 1rem 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: transform 0.2s;
    }
    .chat-input button:hover {
        transform: translateY(-2px);
    }
    .reset-btn {
        background: rgba(255,255,255,0.2);
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s;
    }
    .reset-btn:hover {
        background: rgba(255,255,255,0.3);
    }
    
    /* 滾動條美化 */
    .chat-messages::-webkit-scrollbar {
        width: 8px;
    }
    .chat-messages::-webkit-scrollbar-track {
        background: #f1f1f1;
    }
    .chat-messages::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <div>
            <h2>💬 智能客服系統</h2>
            <div class="domain-selector">
                <label>當前領域：</label>
                <select id="domainSelect" onchange="switchDomain()">
                    <option value="">載入中...</option>
                </select>
            </div>
        </div>
        <button class="reset-btn" onclick="resetChat()">🔄 重置對話</button>
		<button class="reset-btn" onclick="resetAll()">🗑️ 清空全部</button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            您好！我是智能客服助手 🤖<br>有什麼可以幫助您的嗎？
        </div>
    </div>
    
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="請輸入您的問題..." 
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">發送 📤</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDomains() {
    try {
        const response = await fetch('/chat/domains');
        const data = await response.json();
        
        const select = document.getElementById('domainSelect');
        select.innerHTML = '';
        
        for (const [key, domain] of Object.entries(data.domains)) {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = domain.name;
            if (key === data.current.domain) {
                option.selected = true;
            }
            select.appendChild(option);
        }
    } catch (error) {
        console.error('載入領域失敗:', error);
    }
}

async function switchDomain() {
    const domain = document.getElementById('domainSelect').value;
    
    try {
        // 切換領域
        const response = await fetch('/chat/switch-domain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ domain })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // 清空當前顯示
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = '';
            
            // 載入該領域的歷史
            const historyResponse = await fetch(`/chat/history/${domain}`);
            const historyData = await historyResponse.json();
            
            if (historyData.messages && historyData.messages.length > 0) {
                // 顯示歷史訊息
                historyData.messages.forEach(msg => {
                    addMessage(msg.text, msg.type);
                });
                
                // 加入切換提示
                addMessage(`✅ 已切換至「${data.current.config.name}」`, 'bot');
            } else {
                // 無歷史，顯示歡迎訊息
                addMessage(`✅ 已切換至「${data.current.config.name}」<br><br>有什麼可以幫助您的嗎？`, 'bot');
            }
        }
    } catch (error) {
        console.error('切換領域失敗:', error);
    }
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();
    
    if (!question) return;
    
    addMessage(question, 'user');
    input.value = '';
    addMessage('正在思考中...', 'bot', true);
    
    try {
        const response = await fetch('/chat/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
        });
        
        const data = await response.json();
        removeLoadingMessage();
        
        // 格式化回覆（保留換行）
        addMessage(data.answer, 'bot');
        
    } catch (error) {
        removeLoadingMessage();
        addMessage('❌ 發生錯誤，請稍後再試', 'bot');
    }
}

function addMessage(text, type, isLoading = false) {
    const messagesDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${type}`;
    if (isLoading) messageDiv.id = 'loadingMessage';
    
    // 保留換行與格式
    messageDiv.innerHTML = formatMessage(text);
    
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function formatMessage(text) {
    // 轉換 Markdown 樣式的粗體
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    
    // 處理換行
    text = text.replace(/\n/g, '<br>');
    
    return text;
}

function removeLoadingMessage() {
    const loading = document.getElementById('loadingMessage');
    if (loading) loading.remove();
}

async function resetChat() {
    if (!confirm('確定要重置對話嗎？')) return;
    
    await fetch('/chat/reset', { method: 'POST' });
    
    const messagesDiv = document.getElementById('chatMessages');
    messagesDiv.innerHTML = '<div class="message bot">✅ 對話已重置<br><br>有什麼可以幫助您的嗎？</div>';
}

async function resetAll() {
    if (!confirm('確定要清空所有領域的對話嗎？')) return;
    
    await fetch('/chat/reset-all', { method: 'POST' });
    
    const messagesDiv = document.getElementById('chatMessages');
    messagesDiv.innerHTML = '<div class="message bot">✅ 所有對話已清空<br><br>有什麼可以幫助您的嗎？</div>';
}

// 初始化
loadDomains();
</script>
{% endblock %}
